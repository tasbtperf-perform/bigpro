<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- Library eksternal: Chart.js + plugin datalabels + Leaflet -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    :root{
      --bg:#0f1420; --panel:#161d2e; --panel2:#1c2540; --border:#2a3450;
      --text:#eef1f8; --muted:#9aa5c0; --accent:#4f8dfd; --accent2:#22c3a6;
      --warn:#f5a524; --danger:#f5566b; --good:#22c3a6;
      --radius:14px;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:'Segoe UI',Roboto,Arial,sans-serif; font-size:14px;
    }
    header{
      padding:22px 28px; background:linear-gradient(135deg,#1a2340,#101728);
      border-bottom:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    }
    header h1{font-size:19px; margin:0 0 4px 0; letter-spacing:.3px;}
    header p{margin:0; color:var(--muted); font-size:12.5px;}
    .filters{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      padding:16px 28px; background:var(--panel); border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:20;
    }
    .filters label{font-size:11.5px; color:var(--muted); display:block; margin-bottom:4px;}
    .filters select, .filters button{
      background:var(--panel2); color:var(--text); border:1px solid var(--border);
      border-radius:8px; padding:8px 10px; font-size:13px;
    }
    .filters button{background:var(--accent); border:none; cursor:pointer; font-weight:600;}
    .filters button:hover{opacity:.9;}
    .month-dropdown-btn{
      background:var(--panel2) !important; color:var(--text); border:1px solid var(--border) !important;
      border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; min-width:170px;
      text-align:left; font-weight:400 !important;
    }
    .month-dropdown-btn:hover{ border-color:var(--accent) !important; }
    .month-dropdown-panel{
      display:none; position:absolute; top:calc(100% + 4px); left:0; z-index:50;
      background:var(--panel2); border:1px solid var(--border); border-radius:8px;
      padding:8px; min-width:220px; max-height:280px; overflow-y:auto;
      box-shadow:0 8px 24px rgba(0,0,0,.35);
    }
    .month-dropdown-panel.open{ display:block; }
    .month-option{
      display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px;
      font-size:12.5px; cursor:pointer;
    }
    .month-option:hover{ background:var(--panel); }
    .month-option.master{ border-bottom:1px solid var(--border); margin-bottom:4px; padding-bottom:8px; font-weight:600; }

    main{padding:22px 28px 60px 28px; max-width:1500px; margin:0 auto;}

    .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:22px;}
    .kpi-card{
      background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
      padding:14px 16px;
    }
    .kpi-card .val{font-size:22px; font-weight:700;}
    .kpi-card .label{color:var(--muted); font-size:11.5px; margin:2px 0 8px 0;}
    .kpi-card.accent{border-color:var(--accent);}
    .kpi-card.good{border-color:var(--good);}
    .kpi-card.warn{border-color:var(--warn);}
    .kpi-card.danger{border-color:var(--danger);}
    .kpi-branch-row{
      display:flex; justify-content:space-between; font-size:11px; padding:2.5px 0;
      border-top:1px dashed var(--border); color:var(--muted);
    }
    .kpi-branch-row b{color:var(--text); font-weight:600;}

    .section{margin-bottom:26px;}
    .section h2{
      font-size:15px; margin:0 0 12px 0; display:flex; align-items:center; gap:8px; color:#fff;
    }
    .section h2 .num{
      background:var(--accent); min-width:22px; height:22px; border-radius:11px; padding:0 6px;
      display:inline-flex; align-items:center; justify-content:center; font-size:12px;
    }
    .section h2.collapsible-header{ cursor:pointer; user-select:none; }
    .section h2.collapsible-header:hover{ color:var(--accent); }
    .section h2 .chevron{ margin-left:auto; color:var(--muted); font-size:13px; }
    .section-body.collapsed{ display:none; }

    .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:16px;}
    .grid2e{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
    .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
    @media (max-width:1000px){ .grid2,.grid2e,.grid3{grid-template-columns:1fr;} }

    .card{
      background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
      padding:16px 18px;
    }
    .card h3{margin:0 0 10px 0; font-size:13px; color:var(--muted); font-weight:600;}
    table{width:100%; border-collapse:collapse; font-size:12.5px;}
    th,td{padding:7px 8px; text-align:left; border-bottom:1px solid var(--border);}
    th{color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase;}
    tr:last-child td{border-bottom:none;}
    td.num, th.num{text-align:right;}
    canvas{max-height:360px;}

    .tti-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
    .tti-card{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; text-align:center;}
    .tti-card .v{font-size:20px; font-weight:700; color:var(--accent2);}
    .tti-card .l{font-size:11px; color:var(--muted); margin-top:3px;}

    .rank-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);}
    .rank-row:last-child{border-bottom:none;}
    .rank-pos{
      width:24px; height:24px; border-radius:50%; background:var(--panel2); color:var(--text);
      display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;
    }
    .rank-name{flex:1; font-size:12.5px;}
    .rank-sub{font-size:10.5px; color:var(--muted); margin-top:2px;}
    .rank-val{font-weight:700; font-size:13px;}
    .bar-wrap{background:var(--panel2); border-radius:6px; height:6px; margin-top:4px; overflow:hidden;}
    .bar-fill{height:100%; border-radius:6px;}

    .rec-box{
      background:rgba(34,195,166,.07); border:1px solid rgba(34,195,166,.4);
      border-radius:10px; padding:12px 16px; margin-top:14px;
    }
    .rec-box .rec-title{font-size:11.5px; font-weight:700; color:var(--accent2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px;}
    .rec-box ul{margin:0 0 0 16px; padding:0; font-size:12.5px; line-height:1.65; color:#dbe1f0;}

    .rca-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-top:14px;}
    .rca-card{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
    .rca-card h4{margin:0 0 8px 0; font-size:12px; color:var(--accent);}
    .rca-item{display:flex; justify-content:space-between; font-size:11px; padding:3px 0; color:var(--muted); gap:6px;}
    .rca-item span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .rca-item b{color:var(--text);}

    .summary-card{background:var(--panel); border:1px solid var(--accent); border-radius:var(--radius); padding:20px 22px;}
    .summary-card p{line-height:1.6; margin:0 0 10px 0; color:#dbe1f0;}
    .summary-card ul{margin:8px 0 0 18px; padding:0; line-height:1.7; color:#dbe1f0;}
    .loading{color:var(--muted); text-align:center; padding:40px; font-size:13px;}
    .footer-note{color:var(--muted); font-size:11px; text-align:center; margin-top:30px;}

    #mapContainer{height:520px; border-radius:10px; overflow:hidden; background:var(--panel2);}
    .map-filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
    .map-filters select{
      background:var(--panel2); color:var(--text); border:1px solid var(--border);
      border-radius:8px; padding:7px 10px; font-size:12.5px;
    }
    .map-legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--muted);}
    .map-legend span{display:inline-flex; align-items:center; gap:5px;}
    .map-legend i{width:11px; height:11px; border-radius:50%; display:inline-block;}
    .leaflet-popup-content{font-size:12px; line-height:1.5;}
  </style>
  <style>
    /* Tipografi profesional dengan tema visual dashboard yang tetap dipertahankan. */
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root{
      --bg:#030412; --panel:rgba(10,16,42,.78); --panel2:rgba(16,24,60,.85);
      --border:rgba(0,240,255,.22); --border-hot:rgba(255,47,214,.35);
      --text:#e6ecff; --muted:#8fa8e0;
      --accent:#00f0ff; --accent2:#39ff88; --neon-pink:#ff2fd6; --neon-violet:#9b5cff;
      --warn:#ffd60a; --danger:#ff5c8a; --good:#39ff88;
      --glow-cyan:0 0 12px rgba(0,240,255,.35);
      --glow-pink:0 0 12px rgba(255,47,214,.35);
    }
    body{
      color:var(--text);
      font-family:'Plus Jakarta Sans','Avenir Next','Segoe UI',Roboto,Arial,sans-serif; font-size:14px;
      background:
        radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.55) 50%, transparent 51%),
        radial-gradient(1px 1px at 34% 68%, rgba(180,220,255,.45) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 57% 12%, rgba(255,255,255,.40) 50%, transparent 51%),
        radial-gradient(1px 1px at 72% 82%, rgba(200,240,255,.45) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 88% 38%, rgba(255,255,255,.5) 50%, transparent 51%),
        radial-gradient(1px 1px at 45% 45%, rgba(160,200,255,.35) 50%, transparent 51%),
        radial-gradient(1px 1px at 8% 88%, rgba(255,255,255,.35) 50%, transparent 51%),
        radial-gradient(ellipse 60% 40% at 80% -10%, rgba(123,47,255,.20), transparent 65%),
        radial-gradient(ellipse 55% 45% at 5% 110%, rgba(0,240,255,.12), transparent 65%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(255,47,214,.06), transparent 70%),
        linear-gradient(160deg,#05061a 0%, #030412 55%, #060318 100%);
      background-attachment:fixed;
    }
    header{
      background:linear-gradient(135deg, rgba(10,14,44,.92), rgba(4,6,24,.92));
      border-bottom:1px solid var(--border);
      box-shadow:0 4px 30px rgba(0,240,255,.08), inset 0 -1px 0 rgba(255,47,214,.15);
      position:relative; overflow:hidden;
    }
    header:before{
      content:''; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(90deg, transparent, rgba(0,240,255,.07) 30%, rgba(255,47,214,.07) 70%, transparent);
    }
    header h1{
      font-family:'Plus Jakarta Sans','Avenir Next',sans-serif; font-size:19px;
      font-weight:700; letter-spacing:.1px; text-transform:none;
      background:linear-gradient(90deg,#00f0ff,#9b5cff 55%,#ff2fd6);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:none;
    }
    header p{letter-spacing:.1px;}
    .filters{
      background:rgba(6,10,32,.92); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
      box-shadow:0 6px 24px rgba(3,4,18,.6);
    }
    .filters label{font-size:11.5px; font-weight:600; letter-spacing:.1px; text-transform:none;}
    .filters select, .filters button{font-family:inherit;}
    .filters select:hover{border-color:var(--accent); box-shadow:var(--glow-cyan);}
    .filters button{
      background:linear-gradient(135deg,#00c8f0,#7b2fff); color:#fff;
      font-weight:700; letter-spacing:.1px; text-transform:none;
      box-shadow:0 0 16px rgba(0,240,255,.35);
    }
    .filters button:hover{opacity:1; filter:brightness(1.15); box-shadow:0 0 22px rgba(123,47,255,.55);}
    .month-dropdown-btn{ text-transform:none !important; box-shadow:none !important; }
    .month-dropdown-btn:hover{ box-shadow:var(--glow-cyan) !important; }
    .month-dropdown-panel{
      background:#0a1130;
      box-shadow:0 8px 32px rgba(0,0,0,.6), var(--glow-cyan);
    }
    .month-option:hover{ background:rgba(0,240,255,.08); }
    input[type="checkbox"]{ accent-color:#00f0ff; }

    .kpi-card{
      backdrop-filter:blur(8px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
      transition:box-shadow .25s, transform .25s;
    }
    .kpi-card:hover{ box-shadow:var(--glow-cyan); transform:translateY(-2px); }
    .kpi-card .val{font-family:'DM Sans','Plus Jakarta Sans',sans-serif; font-size:22px; font-weight:700; letter-spacing:-.3px;}
    .kpi-card .label{font-size:11.5px; font-weight:500; letter-spacing:.05px; text-transform:none;}
    .kpi-card.accent{border-color:rgba(0,240,255,.5); box-shadow:0 0 14px rgba(0,240,255,.15);}
    .kpi-card.accent .val{color:var(--accent); text-shadow:0 0 14px rgba(0,240,255,.55);}
    .kpi-card.good{border-color:rgba(57,255,136,.45); box-shadow:0 0 14px rgba(57,255,136,.12);}
    .kpi-card.good .val{color:var(--good); text-shadow:0 0 14px rgba(57,255,136,.5);}
    .kpi-card.warn{border-color:rgba(255,214,10,.4); box-shadow:0 0 14px rgba(255,214,10,.10);}
    .kpi-card.warn .val{color:var(--warn); text-shadow:0 0 14px rgba(255,214,10,.45);}
    .kpi-card.danger{border-color:rgba(255,92,138,.45); box-shadow:0 0 14px rgba(255,92,138,.12);}
    .kpi-card.danger .val{color:var(--danger); text-shadow:0 0 14px rgba(255,92,138,.5);}
    .kpi-card .val{ text-shadow:none !important; }
    .kpi-branch-row{border-top:1px dashed rgba(0,240,255,.15);}

    .section h2{
      font-family:'Plus Jakarta Sans','Avenir Next',sans-serif; font-size:14.5px;
      font-weight:700; letter-spacing:.1px; text-transform:none; gap:10px;
    }
    .section h2 .num{
      background:linear-gradient(135deg,#00c8f0,#7b2fff);
      min-width:24px; height:24px; border-radius:12px;
      box-shadow:0 0 12px rgba(0,240,255,.5);
    }
    .section h2.collapsible-header:hover{ color:var(--accent); text-shadow:none; }
    .section h2 .chevron{ color:var(--accent); text-shadow:0 0 8px rgba(0,240,255,.8); }

    .card{
      backdrop-filter:blur(8px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    }
    .card h3{font-size:12.5px; color:var(--accent); font-weight:700; letter-spacing:.1px; text-transform:none;}
    th,td{border-bottom:1px solid rgba(0,240,255,.12);}
    th{font-family:'Plus Jakarta Sans',sans-serif; letter-spacing:.05px; text-transform:none;}
    tr:last-child td{border-bottom:none;}

    .tti-card{ box-shadow:0 0 10px rgba(0,240,255,.06); }
    .tti-card .v{font-family:'DM Sans','Plus Jakarta Sans',sans-serif; font-size:20px; font-weight:700; letter-spacing:-.2px; text-shadow:none;}

    .rank-row{border-bottom:1px solid rgba(0,240,255,.10);}
    .rank-row:last-child{border-bottom:none;}
    .rank-pos{
      color:var(--accent); border:1px solid var(--border);
      font-family:'DM Sans','Plus Jakarta Sans',sans-serif;
    }
    .rank-val{font-family:'DM Sans','Plus Jakarta Sans',sans-serif; font-weight:700;}
    .bar-wrap{background:rgba(0,240,255,.08);}
    .bar-fill{box-shadow:0 0 8px currentColor;}

    .rec-box{
      background:rgba(57,255,136,.06); border:1px solid rgba(57,255,136,.35);
      box-shadow:0 0 14px rgba(57,255,136,.08);
    }
    .rec-box .rec-title{
      font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px;
      letter-spacing:.15px; text-transform:none; text-shadow:none;
    }
    .rec-box ul{color:#d5e2ff;}

    .rca-card{
      border:1px solid rgba(155,92,255,.3);
      box-shadow:0 0 10px rgba(155,92,255,.08);
    }
    .rca-card h4{color:var(--neon-violet); letter-spacing:.6px; text-shadow:0 0 10px rgba(155,92,255,.5);}

    .summary-card{
      border:1px solid rgba(0,240,255,.45); backdrop-filter:blur(8px);
      box-shadow:0 0 24px rgba(0,240,255,.12), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .summary-card p, .summary-card ul{color:#d5e2ff;}
    .loading{letter-spacing:.1px;}
    .footer-note{letter-spacing:.1px;}

    #mapContainer{
      background:#060a20;
      border:1px solid var(--border); box-shadow:0 0 18px rgba(0,240,255,.08);
    }
    .map-filters{align-items:center;}
    .map-filters select{font-family:inherit;}
    .map-toggle{
      display:inline-flex; align-items:center; gap:7px; font-size:12.5px; cursor:pointer;
      color:var(--neon-pink); border:1px dashed var(--border-hot); border-radius:8px; padding:7px 12px;
      text-shadow:0 0 8px rgba(255,47,214,.4);
    }
    .map-toggle:hover{ box-shadow:var(--glow-pink); }
    .map-legend i{box-shadow:0 0 8px currentColor;}

    /* Popup Leaflet bergaya Neo-Quantum */
    .leaflet-popup-content-wrapper{
      background:rgba(8,12,36,.96); color:var(--text); border:1px solid var(--border);
      border-radius:10px; box-shadow:0 0 22px rgba(0,240,255,.25);
    }
    .leaflet-popup-tip{ background:rgba(8,12,36,.96); border:1px solid var(--border); }
    .leaflet-popup-content{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif; margin:12px 14px;}
    .leaflet-popup-content b{color:var(--text);}
    .pop-head{
      font-family:'Plus Jakarta Sans',sans-serif; font-size:12.5px; font-weight:700; color:var(--accent);
      letter-spacing:.1px; margin-bottom:7px; text-shadow:none;
    }
    .pop-status{
      background:linear-gradient(135deg,#ff2fd6,#9b5cff); color:#fff; font-size:9.5px;
      border-radius:8px; padding:2px 8px; margin-left:5px; letter-spacing:.1px; vertical-align:middle;
    }
    .pop-table{width:100%; border-collapse:collapse;}
    .pop-table td{padding:2.5px 4px; border-bottom:1px solid rgba(0,240,255,.10); font-size:11.5px;}
    .pop-table td:first-child{color:var(--muted); white-space:nowrap; padding-right:10px; text-transform:none; font-size:10.5px; letter-spacing:.05px;}
    .pop-table tr:last-child td{border-bottom:none;}
    .pop-warn{
      margin-top:8px; padding:6px 9px; border:1px dashed rgba(255,47,214,.5); border-radius:7px;
      color:var(--neon-pink); font-size:11px;
    }
    .leaflet-container{ background:#e9eef2; }
    /* Leaflet memakai canvas sendiri. Jangan terkena max-height canvas chart. */
    .leaflet-container canvas{max-height:none !important;}
    a.leaflet-popup-close-button{ color:var(--muted) !important; }

    .kpi-clickable{cursor:pointer; border-radius:7px; transition:background .15s,box-shadow .15s;}
    .kpi-clickable:hover,.kpi-clickable:focus{background:rgba(0,240,255,.08); box-shadow:0 0 12px rgba(0,240,255,.18); outline:none;}
    .kpi-card>.kpi-clickable{padding:5px 7px; margin:-5px -7px 5px;}
    .kpi-branch-row.kpi-clickable{padding:5px 6px; margin:0 -6px;}
    .detail-modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(2,4,16,.82);padding:24px;align-items:center;justify-content:center;}
    .detail-modal.open{display:flex;}
    .detail-dialog{width:min(1280px,96vw);max-height:92vh;display:flex;flex-direction:column;background:#080c24;border:1px solid var(--border);border-radius:14px;box-shadow:0 0 36px rgba(0,240,255,.25);}
    .detail-head{padding:15px 18px;display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);}
    .detail-head h3{margin:0 0 4px;color:var(--accent);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:.1px;}
    .detail-head p{margin:0;color:var(--muted);font-size:11.5px;}
    .detail-close{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;}
    .detail-tools{padding:10px 18px;border-bottom:1px solid var(--border);}
    .detail-tools input{width:min(430px,100%);background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
    .detail-body{padding:0 18px 18px;overflow:auto;}
    .detail-table{min-width:1080px;}
    .table-scroll{overflow:auto;}.tti-table{min-width:760px;}
    .ticket-type{display:inline-block;padding:2px 6px;border-radius:9px;background:rgba(0,240,255,.12);color:var(--accent);font-size:10px;font-weight:700;}

    ::-webkit-scrollbar{width:9px; height:9px;}
    ::-webkit-scrollbar-track{background:#060a20;}
    ::-webkit-scrollbar-thumb{background:linear-gradient(#00c8f0,#7b2fff); border-radius:5px;}
  </style>
</head>
<body>

<header>
  <div>
    <h1>Dashboard Fulfillment Performance — IAM Regional Sumbagteng</h1>
    <p>PT Telkom Akses · Pekanbaru · Batam · Padang · Bukittinggi · Dumai</p>
  </div>
  <div id="lastUpdate" style="color:var(--muted); font-size:11.5px;"></div>
</header>

<div class="filters">
  <div style="position:relative;">
    <label>Bulan (DATECREATED)</label>
    <button type="button" class="month-dropdown-btn" id="monthDropdownBtn">Semua Bulan ▾</button>
    <div class="month-dropdown-panel" id="monthDropdownPanel"></div>
  </div>
  <div>
    <label>Branch (DISTRICT_TIF)</label>
    <select id="fBranch"><option value="ALL">Semua Branch</option></select>
  </div>
  <div>
    <label>HomeID</label>
    <select id="fHomeId">
      <option value="ALL">Semua</option>
      <option value="HOMEID">HomeID</option>
      <option value="NONHOMEID">Non HomeID</option>
    </select>
  </div>
  <div style="align-self:flex-end;">
    <button id="btnApply">Terapkan Filter</button>
  </div>
  <div style="align-self:flex-end; color:var(--muted); font-size:12px;" id="rowCountLabel"></div>
</div>

<main id="mainContent">
  <div class="loading">Memuat data dashboard...</div>
</main>

<div class="detail-modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="detail-dialog">
    <div class="detail-head"><div><h3 id="detailTitle">Rincian Tiket</h3><p id="detailSubtitle"></p></div><button class="detail-close" id="detailClose" type="button">&times;</button></div>
    <div class="detail-tools"><input id="detailSearch" type="search" placeholder="Cari WONUM, pelanggan, teknisi, branch..."></div>
    <div class="detail-body" id="detailBody"><div class="loading">Memuat rincian...</div></div>
  </div>
</div>

<script>
  var CH = { trend:null, home:null, age:null };
  // Palet Neo-Quantum (cyber-neon)
  var COLORS = ['#00f0ff','#39ff88','#ffd60a','#ff2fd6','#9b5cff','#4dc3ff','#ff7a2f','#ff5c8a'];
  var BRANCH_COLORS = { }; // diisi dinamis
  var LAST_DATA = null;
  var MAP = { instance:null, layer:null, points:[], loaded:false, meta:null };
  var MONTH_OPTS = [];
  var DETAIL_ITEMS = [];
  var DATA_SHEETS = [];
  var MAX_PARALLEL_LOADS = 3;
  var FILTERS_READY = false;

  function el(id){ return document.getElementById(id); }
  function fmt(n){ return (n||0).toLocaleString('id-ID'); }
  function esc(v){return String(v===null||v===undefined?'':v).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}

  function init(){
    if (window.Chart) {
      Chart.defaults.font.family = "'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif";
      Chart.defaults.font.size = 11;
      if (window.ChartDataLabels) Chart.register(ChartDataLabels);
    }
    el('detailClose').addEventListener('click', closeDetail);
    el('detailModal').addEventListener('click', function(e){if(e.target===this)closeDetail();});
    el('detailSearch').addEventListener('input', renderDetailRows);
    document.addEventListener('keydown', function(e){if(e.key==='Escape')closeDetail();});
    google.script.run.withSuccessHandler(function(cfg){
      DATA_SHEETS=cfg.sheets||[];
      loadDashboardParts({months:[],branch:'ALL',homeid:'ALL'},true);
    }).withFailureHandler(onError).FULL_getDashboardLoadConfig();
  }

  function loadDashboardParts(filters,isInitial){
    var parts=[],completed=0,failed=false,total=DATA_SHEETS.length,nextIndex=0,active=0;
    if(!total){onError(new Error('Supabase tidak mengembalikan bagian data. Periksa jumlah baris dan hak akses tabel.'));return;}
    el('mainContent').innerHTML='<div class="loading">Memproses '+total+' bagian data Supabase...</div>';
    function finish(){
      el('mainContent').innerHTML='<div class="loading">Menggabungkan hasil Supabase...</div>';
      google.script.run.withSuccessHandler(function(payload){
        if(isInitial&&!FILTERS_READY){setupFilterOptions(payload.options);FILTERS_READY=true;}
        onData(payload.dashboard);
      }).withFailureHandler(onError).FULL_finalizeDashboardParts(parts,filters);
    }
    function pump(){
      if(failed)return;
      if(completed===total){finish();return;}
      while(active<MAX_PARALLEL_LOADS&&nextIndex<total){
        (function(partName){
          active++;
          google.script.run.withSuccessHandler(function(part){
            if(failed)return;
            active--;parts.push(part);completed++;
            el('mainContent').innerHTML='<div class="loading">Selesai '+completed+'/'+total+' bagian data...</div>';
            pump();
          }).withFailureHandler(function(err){if(failed)return;failed=true;onError(err);}).FULL_getDashboardPart(partName,filters);
        })(DATA_SHEETS[nextIndex++]);
      }
    }
    pump();
  }

  function setupFilterOptions(opts){
    buildMonthDropdown(opts.months);
    var fBranch = el('fBranch');
    opts.branches.forEach(function(b){
      var o = document.createElement('option'); o.value = b; o.textContent = b;
      fBranch.appendChild(o);
    });
    el('btnApply').addEventListener('click', applyFilters);
  }

  function buildMonthDropdown(months){
    MONTH_OPTS = months;
    var panel = el('monthDropdownPanel');
    var html = '<label class="month-option master"><input type="checkbox" id="monthAllChk" checked> Semua Bulan</label>';
    months.forEach(function(m){
      html += '<label class="month-option"><input type="checkbox" class="month-item-chk" value="'+m.value+'" checked> '+m.label+'</label>';
    });
    panel.innerHTML = html;

    el('monthAllChk').addEventListener('change', function(){
      var checked = this.checked;
      panel.querySelectorAll('.month-item-chk').forEach(function(cb){ cb.checked = checked; });
      updateMonthButtonLabel();
    });
    panel.querySelectorAll('.month-item-chk').forEach(function(cb){
      cb.addEventListener('change', function(){
        var all = panel.querySelectorAll('.month-item-chk');
        var checkedCount = panel.querySelectorAll('.month-item-chk:checked').length;
        el('monthAllChk').checked = (checkedCount === all.length);
        updateMonthButtonLabel();
      });
    });

    var btn = el('monthDropdownBtn');
    btn.addEventListener('click', function(e){ e.stopPropagation(); panel.classList.toggle('open'); });
    document.addEventListener('click', function(e){
      if (!panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
    });
    updateMonthButtonLabel();
  }

  function updateMonthButtonLabel(){
    var panel = el('monthDropdownPanel');
    var checked = Array.prototype.slice.call(panel.querySelectorAll('.month-item-chk:checked'));
    var btn = el('monthDropdownBtn');
    if (checked.length === 0) btn.textContent = 'Tidak ada bulan dipilih ▾';
    else if (checked.length === MONTH_OPTS.length) btn.textContent = 'Semua Bulan ▾';
    else if (checked.length <= 2) btn.textContent = checked.map(function(cb){ return cb.parentElement.textContent.trim(); }).join(', ') + ' ▾';
    else btn.textContent = checked.length + ' bulan dipilih ▾';
  }

  function getFilters(){
    var panel = el('monthDropdownPanel');
    var allChecked = panel.querySelectorAll('.month-item-chk:checked').length === MONTH_OPTS.length;
    var months = allChecked ? [] : Array.prototype.slice.call(panel.querySelectorAll('.month-item-chk:checked')).map(function(cb){ return cb.value; });
    return { months: months, branch: el('fBranch').value, homeid: el('fHomeId').value };
  }

  function applyFilters(){
    el('monthDropdownPanel').classList.remove('open');
    el('mainContent').innerHTML = '<div class="loading">Memuat data dashboard...</div>';
    MAP.loaded = false; MAP.instance = null;
    loadDashboardParts(getFilters(),false);
  }

  function onError(err){
    el('mainContent').innerHTML = '<div class="loading" style="color:var(--danger)">Gagal memuat data: ' + (err.message || err) + '</div>';
  }

  function onData(data){
    LAST_DATA = data;
    el('rowCountLabel').textContent = fmt(data.rowCount) + ' tiket sesuai filter';
    el('lastUpdate').textContent = 'Diperbarui: ' + new Date().toLocaleString('id-ID') + ' · cache maks. 5 menit';
    data.trend.branches.forEach(function(b,i){ BRANCH_COLORS[b] = COLORS[i % COLORS.length]; });
    render(data);
  }

  function recBox(recs){
    if (!recs || !recs.length) return '';
    return '<div class="rec-box"><div class="rec-title">Rekomendasi</div><ul>'
      + recs.map(function(r){ return '<li>'+r+'</li>'; }).join('') + '</ul></div>';
  }

  function collapsibleSection(num, title, bodyHtml, extraAttr){
    return '<div class="section">'
      + '<h2 class="collapsible-header" onclick="toggleSection(this)">'
      + '<span class="num">'+num+'</span>'+title
      + '<span class="chevron">▸</span></h2>'
      + '<div class="section-body collapsed" '+(extraAttr||'')+'>'+bodyHtml+'</div>'
      + '</div>';
  }

  function toggleSection(header){
    var body = header.nextElementSibling;
    var wasCollapsed = body.classList.contains('collapsed');
    body.classList.toggle('collapsed');
    header.querySelector('.chevron').textContent = wasCollapsed ? '▾' : '▸';
    if (wasCollapsed) {
      setTimeout(function(){
        Object.keys(CH).forEach(function(k){ if (CH[k]) CH[k].resize(); });
        if (body.id === 'mapSectionBody') initMapIfNeeded();
        if (MAP.instance) MAP.instance.invalidateSize();
      }, 60);
    }
  }

  function render(data){
    el('mainContent').innerHTML = buildLayout(data);
    renderKpi(data.kpi);
    renderTrend(data.trend);
    renderHome(data.homeSection);
    renderAge(data.ageSection);
    renderTeams(data.teams);
    renderExecutive(data.executive);
  }

  function buildLayout(data){
    return ''
    + '<div class="section"><h2><span class="num">1</span>Ringkasan KPI per Branch</h2>'
    + '<div class="kpi-grid" id="kpiGrid"></div></div>'

    + '<div class="section"><h2><span class="num">2</span>Trend PS / RE Bulanan + Branch & RCA Non-PS</h2>'
    + '<div class="card"><canvas id="chartTrend" style="max-height:420px;"></canvas></div>'
    + '<div class="rca-grid" id="rcaGrid"></div>'
    + '<div id="trendRec"></div></div>'

    + collapsibleSection('3', 'HomeID vs Non HomeID — Trend %PS, TTI & Top Kendala', ''
      + '<div class="card" style="margin-bottom:14px;"><h3>Trend %PS Bulanan per Kelompok</h3><canvas id="chartHome"></canvas></div>'
      + '<div class="tti-grid" id="ttiGrid"></div>'
      + '<div class="grid2e" style="margin-bottom:14px;">'
      + '<div class="card"><h3>10 Nomor Tercepat Terinstal</h3><div class="table-scroll" id="ttiFastWrap"></div></div>'
      + '<div class="card"><h3>10 Nomor Terlama Terinstal</h3><div class="table-scroll" id="ttiSlowWrap"></div></div>'
      + '</div>'
      + '<div class="grid2e">'
      + '<div class="card"><h3>Top 5 WORKFAIL (SUBERRORCODE_AKHIR)</h3><div id="homeWfWrap"></div></div>'
      + '<div class="card"><h3>Top 5 CANCLWORK (SUBERRORCODE_AKHIR)</h3><div id="homeCwWrap"></div></div>'
      + '</div>'
      + '<div id="homeRec"></div>')

    + collapsibleSection('4', 'Umur Tiket Kendala — WORKFAIL & CANCLWORK', ''
      + '<div class="card"><h3>Distribusi umur tiket sejak tanggal kendala (STATUSDATE)</h3><canvas id="chartAge"></canvas></div>'
      + '<div id="ageRec"></div>')

    + collapsibleSection('5', 'Ranking Tim (CHIEF_NAME) — dengan Split HomeID / Non HomeID', ''
      + '<div class="grid2e">'
      + '<div class="card"><h3>🏆 5 Tim Terbaik — PS Terbanyak</h3><div id="topTeamsWrap"></div></div>'
      + '<div class="card"><h3>⚠️ 5 Tim Perlu Perhatian — CANCLWORK Terbanyak</h3><div id="worstTeamsWrap"></div></div>'
      + '</div>'
      + '<div id="teamsRec"></div>')

    + collapsibleSection('6', 'Peta Sebaran Tiket Kendala (WORKFAIL & CANCLWORK)', ''
      + '<div class="card">'
      + '<div class="map-filters">'
      + '<select id="mapErrFilter"><option value="ALL">Semua Klasifikasi (ERRORCODE_AKHIR)</option></select>'
      + '<select id="mapSubFilter"><option value="ALL">Semua Detail (SUBERRORCODE_AKHIR)</option></select>'
      + '<label class="map-toggle"><input type="checkbox" id="mapShowInvalid"> Tampilkan koordinat tidak valid (<span id="mapInvalidCount">0</span>)</label>'
      + '</div>'
      + '<div id="mapInfo" style="color:var(--muted); font-size:12px; margin-bottom:10px;"></div>'
      + '<div id="mapContainer"><div class="loading">Klik section ini untuk memuat peta...</div></div>'
      + '<div class="map-legend" id="mapLegend"></div>'
      + '</div>', 'id="mapSectionBody"')

    + '<div class="section"><h2><span class="num">7</span>Executive Summary</h2>'
    + '<div class="summary-card" id="summaryWrap"></div></div>'

    + '<div class="footer-note">Dashboard Fulfillment Performance · Sumber: sheet RE Jan / RE Maret / RE Mei · Google Apps Script</div>';
  }

  // ===== 1) KPI per branch =====
  function renderKpi(kpi){
    var t = kpi.total;
    var defs = [
      { key:'re', label:'Total RE (Tiket Masuk)', val:fmt(t.re), cls:'accent' },
      { key:'ps', label:'Total PS (Selesai)', val:fmt(t.ps), cls:'good' },
      { key:'ratio', label:'Rasio PS/RE', val:t.ratio+'%', cls:'good', pct:true },
      { key:'wf', label:'Total WORKFAIL', val:fmt(t.wf), cls:'warn' },
      { key:'cw', label:'Total CANCLWORK', val:fmt(t.cw), cls:'danger' },
      { key:'home', label:'Tiket HomeID', val:fmt(t.home), cls:'' },
      { key:'nonhome', label:'Tiket Non HomeID', val:fmt(t.nonhome), cls:'' }
    ];
    el('kpiGrid').innerHTML = defs.map(function(d){
      var rows = kpi.perBranch.map(function(pb){
        var v = d.pct ? pb[d.key]+'%' : fmt(pb[d.key]);
        return '<div class="kpi-branch-row kpi-clickable" tabindex="0" role="button" data-metric="'+esc(d.key)+'" data-branch="'+esc(pb.branch)+'" data-label="'+esc(d.label)+' — '+esc(pb.branch)+'"><span>'+esc(pb.branch)+'</span><b>'+v+'</b></div>';
      }).join('');
      return '<div class="kpi-card '+d.cls+'"><div class="kpi-clickable" tabindex="0" role="button" data-metric="'+esc(d.key)+'" data-branch="ALL" data-label="'+esc(d.label)+'"><div class="val">'+d.val+'</div><div class="label">'+esc(d.label)+' · klik untuk rincian</div></div>'+rows+'</div>';
    }).join('');
    el('kpiGrid').addEventListener('click', handleKpiClick);
    el('kpiGrid').addEventListener('keydown', function(e){if((e.key==='Enter'||e.key===' ')&&e.target.closest('.kpi-clickable')){e.preventDefault();handleKpiClick(e);}});
  }

  function handleKpiClick(e){
    var target=e.target.closest('.kpi-clickable'); if(!target)return; e.stopPropagation();
    openDetail(target.getAttribute('data-metric'),target.getAttribute('data-branch'),target.getAttribute('data-label'));
  }
  function openDetail(metric,branch,label,criteria){
    criteria=criteria||{};
    DETAIL_ITEMS=[]; el('detailTitle').textContent=label||'Rincian Tiket'; el('detailSearch').value='';
    el('detailSubtitle').textContent=metric==='ratio'?'Tiket PS pembentuk pembilang rasio PS/RE.':'Memuat tiket sesuai filter aktif.';
    el('detailBody').innerHTML='<div class="loading">Memuat rincian tiket...</div>'; el('detailModal').classList.add('open');
    var parts=[],completed=0,failed=false,filters=getFilters(),sourceCount=DATA_SHEETS.length,nextIndex=0,active=0;
    function fail(err){el('detailBody').innerHTML='<div class="loading" style="color:var(--danger)">Gagal memuat rincian: '+esc(err.message||err)+'</div>';}
    function finish(){var total=0;DETAIL_ITEMS=[];parts.forEach(function(p){total+=p.total||0;DETAIL_ITEMS=DETAIL_ITEMS.concat(p.items||[]);});DETAIL_ITEMS.sort(function(a,b){return(b.sortTime||0)-(a.sortTime||0);});var truncated=DETAIL_ITEMS.length>500||parts.some(function(p){return p.truncated;});DETAIL_ITEMS=DETAIL_ITEMS.slice(0,500);el('detailSubtitle').textContent=fmt(total)+' tiket'+(truncated?' · 500 terbaru ditampilkan':'')+(metric==='ratio'?' · tiket PS pembentuk rasio':'');renderDetailRows();}
    function pump(){if(failed)return;if(completed===sourceCount){finish();return;}while(active<MAX_PARALLEL_LOADS&&nextIndex<sourceCount){(function(name){active++;google.script.run.withSuccessHandler(function(part){if(failed)return;active--;parts.push(part);completed++;el('detailBody').innerHTML='<div class="loading">Selesai '+completed+'/'+sourceCount+' bagian data...</div>';pump();}).withFailureHandler(function(err){if(failed)return;failed=true;fail(err);}).FULL_getTicketDetailsPart(name,filters,metric,branch,criteria);})(DATA_SHEETS[nextIndex++]);}}pump();
  }
  function closeDetail(){el('detailModal').classList.remove('open');}
  function renderDetailRows(){
    var q=el('detailSearch').value.trim().toLowerCase();
    var rows=DETAIL_ITEMS.filter(function(it){return !q||Object.keys(it).some(function(k){return String(it[k]).toLowerCase().indexOf(q)>=0;});});
    if(!rows.length){el('detailBody').innerHTML='<div class="loading">Tidak ada tiket yang cocok.</div>';return;}
    el('detailBody').innerHTML='<table class="detail-table"><thead><tr><th>WONUM</th><th>Status</th><th>Jenis</th><th>Branch</th><th>Pelanggan</th><th>Teknisi / Chief</th><th>Dibuat</th><th>Waktu Status</th><th>Kendala</th></tr></thead><tbody>'+rows.map(function(it){return '<tr><td><b>'+esc(it.wonum)+'</b></td><td>'+esc(it.status)+'</td><td><span class="ticket-type">'+esc(it.ticketType)+'</span></td><td>'+esc(it.branch)+'</td><td>'+esc(it.customer)+'</td><td>'+esc(it.technician)+'<div class="rank-sub">'+esc(it.chief)+'</div></td><td>'+esc(it.createdAt)+'</td><td>'+esc(it.statusAt)+'</td><td>'+esc(it.error)+'<div class="rank-sub">'+esc(it.subError)+'</div></td></tr>';}).join('')+'</tbody></table>';
  }

  // ===== 2) Trend: bar per branch (RE, label %PS) + garis %PS per branch + garis total =====
  function renderTrend(trend){
    var ctx = document.getElementById('chartTrend');
    if (CH.trend) CH.trend.destroy();

    var labels = trend.months.map(function(m){ return m.label; });
    var datasets = [];

    // Bar RE per branch (y kiri), datalabel = %PS branch-bulan tsb
    trend.branches.forEach(function(b){
      datasets.push({
        type:'bar', label:b+' (RE)', data:trend.branchData[b].re,
        backgroundColor: BRANCH_COLORS[b]+'55', borderColor: BRANCH_COLORS[b], borderWidth:1,
        yAxisID:'y', order:3,
        datalabels:{
          display:true, anchor:'end', align:'start', rotation:-90,
          color:'#eef1f8', font:{size:9, weight:'bold'},
          formatter:function(v,c){ return trend.branchData[b].ratio[c.dataIndex]+'%'; }
        }
      });
    });

    // Garis %PS per branch (y kanan)
    trend.branches.forEach(function(b){
      datasets.push({
        type:'line', label:b+' (%PS)', data:trend.branchData[b].ratio,
        detailMetric:'ps', detailBranch:b, detailMonthField:'created',
        borderColor: BRANCH_COLORS[b], backgroundColor:'transparent',
        borderWidth:2, tension:.3, pointRadius:3, yAxisID:'y2', order:1,
        datalabels:{display:false}
      });
    });

    // Garis total RE & PS (y kiri) - grafik eksisting dipertahankan
    datasets.push({
      type:'line', label:'TOTAL RE', data:trend.totalRe,
      borderColor:'#ffffff', borderDash:[6,4], borderWidth:2, tension:.3,
      pointRadius:3, yAxisID:'y', order:2, datalabels:{display:false}
    });
    datasets.push({
      type:'line', label:'TOTAL PS', data:trend.totalPs,
      detailMetric:'ps', detailBranch:'ALL', detailMonthField:'status',
      borderColor:'#39ff88', borderDash:[2,3], borderWidth:2, tension:.3,
      pointRadius:3, yAxisID:'y', order:2, datalabels:{display:false}
    });

    CH.trend = new Chart(ctx, {
      data:{ labels:labels, datasets:datasets },
      options:{
        responsive:true,
        interaction:{ mode:'index', intersect:false },
        onHover:function(evt){var hits=this.getElementsAtEventForMode(evt,'nearest',{intersect:true},true);evt.native.target.style.cursor=hits.some(function(x){return this.data.datasets[x.datasetIndex].detailMetric;},this)?'pointer':'default';},
        onClick:function(evt,elements,chart){
          var hit=chart.getElementsAtEventForMode(evt,'nearest',{intersect:true},true).filter(function(x){return chart.data.datasets[x.datasetIndex].detailMetric;})[0];
          if(!hit)return;
          var ds=chart.data.datasets[hit.datasetIndex],month=trend.months[hit.index];
          openDetail('ps',ds.detailBranch||'ALL',ds.label+' — '+month.label,{month:month.key,monthField:ds.detailMonthField});
        },
        plugins:{
          legend:{ labels:{ color:'#e6ecff', font:{size:10.5}, boxWidth:14 } },
          tooltip:{
            callbacks:{
              label:function(c){
                if (c.dataset.yAxisID === 'y2') return c.dataset.label+': '+c.parsed.y+'%';
                return c.dataset.label+': '+fmt(c.parsed.y)+' tiket';
              }
            }
          }
        },
        scales:{
          x:{ stacked:false, ticks:{color:'#8fa8e0'}, grid:{color:'rgba(0,240,255,.10)'} },
          y:{ position:'left', title:{display:true, text:'Jumlah Tiket', color:'#8fa8e0'}, ticks:{color:'#8fa8e0'}, grid:{color:'rgba(0,240,255,.10)'} },
          y2:{ position:'right', min:0, max:100, title:{display:true, text:'%PS', color:'#8fa8e0'}, ticks:{color:'#8fa8e0', callback:function(v){return v+'%';}}, grid:{display:false} }
        }
      }
    });

    // RCA non-PS top 5 per bulan
    el('rcaGrid').innerHTML = trend.rcaMonthly.map(function(m){
      var items = m.items.length ? m.items.map(function(it){
        return '<div class="rca-item"><span title="'+it.name+'">'+it.name+'</span><b>'+fmt(it.count)+'</b></div>';
      }).join('') : '<div class="rca-item"><span>(tidak ada tiket non-PS)</span></div>';
      return '<div class="rca-card"><h4>RCA Non-PS · '+m.monthLabel+'</h4>'+items+'</div>';
    }).join('');

    el('trendRec').innerHTML = recBox(trend.recommendations);
  }

  // ===== 3) HomeID section =====
  function renderHome(hs){
    var ctx = document.getElementById('chartHome');
    if (CH.home) CH.home.destroy();
    CH.home = new Chart(ctx, {
      type:'line',
      data:{
        labels: hs.months.map(function(m){ return m.label; }),
        datasets:[
          { label:'HomeID (%PS)', data:hs.homePct, detailHomeId:'HOMEID', borderColor:COLORS[1], backgroundColor:'rgba(34,195,166,.12)', tension:.3, fill:true, pointRadius:4, datalabels:{display:false} },
          { label:'Non HomeID (%PS)', data:hs.nonPct, detailHomeId:'NONHOMEID', borderColor:COLORS[3], backgroundColor:'rgba(245,86,107,.12)', tension:.3, fill:true, pointRadius:4, datalabels:{display:false} }
        ]
      },
      options:{
        interaction:{mode:'index', intersect:false},
        onHover:function(evt){var hits=this.getElementsAtEventForMode(evt,'nearest',{intersect:true},true);evt.native.target.style.cursor=hits.length?'pointer':'default';},
        onClick:function(evt,elements,chart){var hit=chart.getElementsAtEventForMode(evt,'nearest',{intersect:true},true)[0];if(!hit)return;var ds=chart.data.datasets[hit.datasetIndex],month=hs.months[hit.index];openDetail('ps','ALL',ds.label+' — '+month.label,{month:month.key,monthField:'created',homeid:ds.detailHomeId});},
        plugins:{
          legend:{labels:{color:'#e6ecff'}},
          tooltip:{callbacks:{label:function(c){ return c.dataset.label+': '+c.parsed.y+'%'; }}}
        },
        scales:{
          x:{ticks:{color:'#8fa8e0'}, grid:{color:'rgba(0,240,255,.10)'}},
          y:{min:0, max:100, ticks:{color:'#8fa8e0', callback:function(v){return v+'%';}}, grid:{color:'rgba(0,240,255,.10)'}}
        }
      }
    });

    el('ttiGrid').innerHTML =
      '<div class="tti-card kpi-clickable ps-tti-detail" data-homeid="HOMEID"><div class="v">'+hs.tti.home+' hari</div><div class="l">TTI Rata-rata HomeID ('+fmt(hs.tti.homeCount)+' tiket PS) · klik rincian</div></div>'
      + '<div class="tti-card kpi-clickable ps-tti-detail" data-homeid="NONHOMEID"><div class="v">'+hs.tti.non+' hari</div><div class="l">TTI Rata-rata Non HomeID ('+fmt(hs.tti.nonCount)+' tiket PS) · klik rincian</div></div>'
      + '<div class="tti-card kpi-clickable ps-tti-detail" data-homeid="ALL"><div class="v">'+hs.tti.all+' hari</div><div class="l">TTI Gabungan (semua tiket PS) · klik rincian</div></div>';
    el('ttiGrid').addEventListener('click',function(e){var card=e.target.closest('.ps-tti-detail');if(!card)return;var h=card.getAttribute('data-homeid');openDetail('ps','ALL','Tiket PS — '+(h==='ALL'?'Semua jenis':h),h==='ALL'?{}:{homeid:h});});

    function ttiTable(list){
      if(!list||!list.length)return '<p style="color:var(--muted);font-size:12px;">Tidak ada tiket PS dengan tanggal lengkap.</p>';
      return '<table class="tti-table"><thead><tr><th>#</th><th>WONUM</th><th>Jenis</th><th>Branch</th><th>Dibuat</th><th>Terinstal</th><th class="num">TTI</th></tr></thead><tbody>'+list.map(function(it,i){return '<tr><td>'+(i+1)+'</td><td><b>'+esc(it.wonum)+'</b></td><td><span class="ticket-type">'+esc(it.ticketType)+'</span></td><td>'+esc(it.branch)+'</td><td>'+esc(it.createdAt)+'</td><td>'+esc(it.installedAt)+'</td><td class="num"><b>'+it.days+' hari</b></td></tr>';}).join('')+'</tbody></table>';
    }
    el('ttiFastWrap').innerHTML=ttiTable(hs.tti.fastest);
    el('ttiSlowWrap').innerHTML=ttiTable(hs.tti.slowest);

    function splitTable(list){
      if (!list.length) return '<p style="color:var(--muted); font-size:12px;">Tidak ada data.</p>';
      return '<table><tr><th>Penyebab</th><th class="num">HomeID</th><th class="num">Non HomeID</th><th class="num">Total</th></tr>'
        + list.map(function(it){
            return '<tr><td>'+it.name+'</td><td class="num">'+fmt(it.home)+'</td><td class="num">'+fmt(it.non)+'</td><td class="num"><b>'+fmt(it.total)+'</b></td></tr>';
          }).join('')
        + '</table>';
    }
    el('homeWfWrap').innerHTML = splitTable(hs.topWf);
    el('homeCwWrap').innerHTML = splitTable(hs.topCw);
    el('homeRec').innerHTML = recBox(hs.recommendations);
  }

  // ===== 4) Umur tiket =====
  function renderAge(ag){
    var ctx = document.getElementById('chartAge');
    if (CH.age) CH.age.destroy();
    CH.age = new Chart(ctx, {
      type:'bar',
      data:{
        labels: ag.buckets,
        datasets:[
          { label:'WORKFAIL', data:ag.workfail, backgroundColor:COLORS[2],
            datalabels:{display:true, anchor:'end', align:'end', color:'#eef1f8', font:{size:10, weight:'bold'}, formatter:function(v){return v>0?fmt(v):'';}} },
          { label:'CANCLWORK', data:ag.cancelwork, backgroundColor:COLORS[3],
            datalabels:{display:true, anchor:'end', align:'end', color:'#eef1f8', font:{size:10, weight:'bold'}, formatter:function(v){return v>0?fmt(v):'';}} }
        ]
      },
      options:{
        plugins:{ legend:{labels:{color:'#e6ecff'}} },
        scales:{
          x:{ticks:{color:'#e6ecff'}, grid:{display:false}, title:{display:true, text:'Umur tiket sejak tanggal kendala', color:'#8fa8e0'}},
          y:{ticks:{color:'#8fa8e0'}, grid:{color:'rgba(0,240,255,.10)'}}
        }
      }
    });
    el('ageRec').innerHTML = recBox(ag.recommendations);
  }

  // ===== 5) Teams dengan split =====
  function renderTeams(tm){
    function teamRows(list, color, metric){
      if (!list.length) return '<p style="color:var(--muted)">Tidak ada data.</p>';
      var max = list[0].total || 1;
      return list.map(function(t,i){
        var pct = Math.round(t.total / max * 100);
        return '<div class="rank-row '+(metric==='ps'?'kpi-clickable ps-team-detail':'')+'" data-chief="'+esc(t.chiefName)+'"><div class="rank-pos">'+(i+1)+'</div>'
          + '<div class="rank-name">'+t.chiefName
          + '<div class="rank-sub">HomeID: <b>'+fmt(t.home)+'</b> · Non HomeID: <b>'+fmt(t.non)+'</b></div>'
          + '<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>'
          + '<div class="rank-val">'+fmt(t.total)+'</div></div>';
      }).join('');
    }
    el('topTeamsWrap').innerHTML = teamRows(tm.top, 'var(--good)','ps');
    el('worstTeamsWrap').innerHTML = teamRows(tm.worst, 'var(--danger)','cw');
    el('topTeamsWrap').addEventListener('click',function(e){var row=e.target.closest('.ps-team-detail');if(!row)return;var chief=row.getAttribute('data-chief');openDetail('ps','ALL','Tiket PS — '+chief,{chief:chief});});
    el('teamsRec').innerHTML = recBox(tm.recommendations);
  }

  // ===== 7) Executive =====
  function renderExecutive(ex){
    el('summaryWrap').innerHTML =
      '<p><strong>Ringkasan Kondisi</strong></p>'
      + ex.narrative.map(function(n){ return '<p>'+n+'</p>'; }).join('')
      + '<p style="margin-top:14px;"><strong>Rekomendasi Utama (rangkuman semua section)</strong></p>'
      + '<ul>' + ex.recommendations.map(function(r){ return '<li>'+r+'</li>'; }).join('') + '</ul>';
  }

  // ===== 6) PETA =====
  var ERR_COLOR_LIST = ['#ff2fd6','#ffd60a','#9b5cff','#00f0ff','#39ff88','#ff7a2f'];
  var ERR_COLORS = {};

  function initMapIfNeeded(){
    if (MAP.loaded) return;
    MAP.loaded = true;
    el('mapContainer').innerHTML = '<div class="loading">Memuat titik kendala dari server...</div>';
    var parts=[],completed=0,failed=false,filters=getFilters(),sourceCount=DATA_SHEETS.length,nextIndex=0,active=0;
    function fail(err){el('mapContainer').innerHTML='<div class="loading" style="color:var(--danger)">Gagal memuat peta: '+esc(err.message||err)+'</div>';MAP.loaded=false;}
    function finish(){var merged={points:[],validCount:0,invalidCount:0,noPlotCount:0,totalAvailable:0,maxPoints:0,truncated:false,noPlotReasons:{}};parts.forEach(function(p){merged.points=merged.points.concat(p.points||[]);merged.validCount+=p.validCount||0;merged.invalidCount+=p.invalidCount||0;merged.noPlotCount+=p.noPlotCount||0;merged.totalAvailable+=p.totalAvailable||0;merged.maxPoints+=p.maxPoints||0;merged.truncated=merged.truncated||p.truncated;Object.keys(p.noPlotReasons||{}).forEach(function(k){merged.noPlotReasons[k]=(merged.noPlotReasons[k]||0)+p.noPlotReasons[k];});});onMapData(merged);}
    function pump(){if(failed)return;if(completed===sourceCount){finish();return;}while(active<MAX_PARALLEL_LOADS&&nextIndex<sourceCount){(function(name){active++;google.script.run.withSuccessHandler(function(part){if(failed)return;active--;parts.push(part);completed++;el('mapContainer').innerHTML='<div class="loading">Selesai '+completed+'/'+sourceCount+' bagian data peta...</div>';pump();}).withFailureHandler(function(err){if(failed)return;failed=true;fail(err);}).FULL_getMapDataPart(name,filters);})(DATA_SHEETS[nextIndex++]);}}pump();
  }

  function onMapData(res){
    MAP.points = res.points;
    MAP.meta = res;
    el('mapInvalidCount').textContent = fmt(res.invalidCount || 0);
    el('mapShowInvalid').checked = false; // default: koordinat tidak valid disembunyikan
    el('mapShowInvalid').onchange = drawMapPoints;
    updateMapInfo(0);

    // build ERR color map & filter dropdowns
    var errSet = {};
    res.points.forEach(function(p){ errSet[p.e] = true; });
    var errs = Object.keys(errSet).sort();
    errs.forEach(function(e,i){ ERR_COLORS[e] = ERR_COLOR_LIST[i % ERR_COLOR_LIST.length]; });

    var errSel = el('mapErrFilter');
    errSel.innerHTML = '<option value="ALL">Semua Klasifikasi (ERRORCODE_AKHIR)</option>'
      + errs.map(function(e){ return '<option value="'+e+'">'+e+'</option>'; }).join('');
    errSel.onchange = function(){ rebuildSubFilter(); drawMapPoints(); };
    el('mapSubFilter').onchange = drawMapPoints;
    rebuildSubFilter();

    el('mapLegend').innerHTML = errs.map(function(e){
      return '<span><i style="background:'+ERR_COLORS[e]+'"></i>'+e+'</span>';
    }).join('');

    el('mapContainer').innerHTML = '';
    MAP.instance = L.map('mapContainer', { preferCanvas:true });
    // Basemap terang: jalan, batas wilayah, dan label kota lebih mudah dibaca.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(MAP.instance);
    MAP.instance.setView([0.4, 101.2], 7); // tengah Sumbagteng
    drawMapPoints();
  }

  function updateMapInfo(shown){
    var m = MAP.meta || {};
    var parts = [fmt(shown) + ' titik ditampilkan'];
    parts.push('valid: ' + fmt(m.validCount || 0));
    parts.push('tidak valid: ' + fmt(m.invalidCount || 0) + (el('mapShowInvalid').checked ? '' : ' (disembunyikan)'));
    if (m.noPlotCount) parts.push('tanpa koordinat: ' + fmt(m.noPlotCount) + ' tiket tidak bisa dipetakan');
    if (m.truncated) parts.push('dibatasi ' + fmt(m.maxPoints) + ' dari ' + fmt(m.totalAvailable));
    el('mapInfo').textContent = parts.join(' · ');
  }

  function rebuildSubFilter(){
    var errVal = el('mapErrFilter').value;
    var subSet = {};
    MAP.points.forEach(function(p){
      if (errVal !== 'ALL' && p.e !== errVal) return;
      subSet[p.s] = true;
    });
    el('mapSubFilter').innerHTML = '<option value="ALL">Semua Detail (SUBERRORCODE_AKHIR)</option>'
      + Object.keys(subSet).sort().map(function(s){ return '<option value="'+s+'">'+s+'</option>'; }).join('');
  }

  function drawMapPoints(){
    if (!MAP.instance) return;
    if (MAP.layer) { MAP.instance.removeLayer(MAP.layer); }
    var errVal = el('mapErrFilter').value;
    var subVal = el('mapSubFilter').value;

    var showInvalid = el('mapShowInvalid').checked;
    var locationGroups = {};
    MAP.points.forEach(function(p){
      if (errVal !== 'ALL' && p.e !== errVal) return;
      if (subVal !== 'ALL' && p.s !== subVal) return;
      if (p.v === 0 && !showInvalid) return; // default: invalid disembunyikan
      var key=Number(p.la).toFixed(5)+','+Number(p.ln).toFixed(5);
      if(!locationGroups[key])locationGroups[key]={lat:p.la,lng:p.ln,points:[],invalid:false};
      locationGroups[key].points.push(p); if(p.v===0)locationGroups[key].invalid=true;
    });
    var markers=Object.keys(locationGroups).map(function(key){
      var g=locationGroups[key],errors={};
      g.points.forEach(function(p){if(!errors[p.e])errors[p.e]={count:0,subs:{}};errors[p.e].count++;errors[p.e].subs[p.s]=(errors[p.e].subs[p.s]||0)+1;});
      var errorNames=Object.keys(errors).sort(function(a,b){return errors[b].count-errors[a].count;});
      var primary=errorNames[0]||'(TIDAK ADA KLASIFIKASI)';
      var popup='<div class="pop-head">ERRORCODE_AKHIR</div>'+errorNames.map(function(errorName){
        var subRows=Object.keys(errors[errorName].subs).sort(function(a,b){return errors[errorName].subs[b]-errors[errorName].subs[a];}).map(function(sub){return '<tr><td>'+esc(sub)+'</td><td style="text-align:right"><b>'+fmt(errors[errorName].subs[sub])+'</b></td></tr>';}).join('');
        return '<div style="color:var(--accent);font-weight:700;margin:7px 0 3px">'+esc(errorName)+' · '+fmt(errors[errorName].count)+' tiket</div><table class="pop-table"><tr><td>SUBERRORCODE_AKHIR</td><td style="text-align:right">JUMLAH</td></tr>'+subRows+'</table>';
      }).join('');
      if(g.invalid)popup+='<div class="pop-warn">&#9888; Kelompok ini memuat koordinat yang ditandai tidak valid.</div>';
      var m=L.circleMarker([g.lat,g.lng],{radius:Math.min(13,6+Math.log(g.points.length+1)/Math.log(2)),weight:g.invalid?2:1.5,color:g.invalid?'#ff2fd6':'rgba(255,255,255,.9)',dashArray:g.invalid?'2,3':null,fillColor:errorNames.length===1?(ERR_COLORS[primary]||'#888'):'#9b5cff',fillOpacity:g.invalid?.5:.9});
      m.bindTooltip(errorNames.length===1?esc(primary)+' · '+fmt(g.points.length)+' tiket':fmt(errorNames.length)+' ERRORCODE · '+fmt(g.points.length)+' tiket');
      m.bindPopup(popup,{maxWidth:420}); return m;
    });
    MAP.layer = L.layerGroup(markers).addTo(MAP.instance);
    if(markers.length){var bounds=L.latLngBounds(markers.map(function(m){return m.getLatLng();}));MAP.instance.fitBounds(bounds.pad(.08),{maxZoom:15});}
    updateMapInfo(markers.length);
  }

  init();
</script>
</body>
</html>
